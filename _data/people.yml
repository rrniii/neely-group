    initials: AM
    role: Postgraduate researcher
    institution: University of Leeds
    supervision: Primary supervisor since 2022
    research: Mixed-phase clouds in Greenland and Antarctica, combining ICESat-2 lidar with ground-based observations.
    profile_link: https://environment.leeds.ac.uk/see/pgr/11242/andrew-martin
    programme_path: /projects/polar-clouds/
    programme_label: Polar clouds and aerosols

  - name: Imogen Wadlow
    initials: IW
    role: Postgraduate researcher
    institution: University of Leeds
    supervision: Secondary supervisor since 2022
    research: Uses Arctic aerosol observations to evaluate and improve the UK Earth System Model. Fieldwork spans Summit, the Southern Ocean and cloud observations at Troll Station, Antarctica.
    profile_link: https://environment.leeds.ac.uk/see/pgr/11267/imogen-wadlow
    programme_path: /projects/polar-clouds/
    programme_label: Polar clouds and aerosols

  - name: Samuel Hodges
    initials: SH
    role: Postgraduate researcher
    institution: University of Leeds
    supervision: Primary supervisor since 2022
    research: BioCast research combines weather radar, insect field observations and atmospheric models to understand how weather influences insect dispersal and biodiversity.
    profile_link: https://environment.leeds.ac.uk/see/pgr/11230/samuel-hodges
    programme_path: /projects/aeroecology/
    programme_label: Radar aeroecology
