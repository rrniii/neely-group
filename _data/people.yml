# Selected public profiles for the Neely research community.
# Roles and research summaries checked against the linked institutional sources
# on 2026-10-10. Supervision periods and roles follow Ryan's published CV.
# People summaries and programme links reviewed against public sources on 2026-10-11.
# Past supervision is not a claim about degree completion or current employment.

principal_investigator:
  name: Ryan R. Neely III
  img: ryan-neely.jpg
  role: Professor of Atmospheric Physics
  institution: University of Leeds and National Centre for Atmospheric Science
  research: >
    Ryan develops radar and lidar observations to understand clouds, aerosols,
    precipitation and life in the atmosphere. His research connects instrument
    development, field measurements and atmospheric modelling.
  profile_link: https://environment.leeds.ac.uk/see/staff/1447/dr-ryan-neely-iii
  email: R.Neely@leeds.ac.uk

research_team:
  - name: Heather Guy
    initials: HG
    role: Research Fellow in Polar Observational Meteorology
    institution: NCAS, University of Leeds
    research: Polar aerosol and cloud observations, including long-term measurements over the Greenland Ice Sheet. Co-leads GAMB2LE with Sarah Barr and Ryan.
    profile_link: https://people.ncas.ac.uk/people/view/472
    programme_path: /projects/gamb2le/
    programme_label: GAMB2LE

  - name: Sarah Barr
    initials: SB
    role: Research Fellow in Polar Observational Meteorology
    institution: NCAS, University of Leeds
    research: Polar observations and the development of the GAMB2LE mobile Greenland observatory. Co-leads GAMB2LE with Heather Guy and Ryan.
    profile_link: https://people.ncas.ac.uk/people/view/579
    programme_path: /projects/gamb2le/
    programme_label: GAMB2LE
    research_source: https://environment.leeds.ac.uk/research/news/article/5910/forecasting-climate-tipping-points

  - name: David Dufton
    initials: DD
    role: Research Fellow in Radar Hydrometeorology
    institution: NCAS, University of Leeds
    research: Weather-radar estimates of precipitation and their uncertainty, with applications in hydrology.
    profile_link: https://people.ncas.ac.uk/people/view/306
    programme_path: /projects/radar/
    programme_label: Radar and precipitation

  - name: Lindsay Bennett
    initials: LB
    role: Radar Operations, Data and Partnerships Lead
    institution: NCAS, University of Leeds
    research: Coordinates access to NCAS weather and cloud radars, including field deployments, data collection and radar research partnerships.
    profile_link: https://people.ncas.ac.uk/people/view/212
    programme_path: /projects/radar/
    programme_label: Radar facilities and research
    # Current institutional profiles use Lindsay Rhodes; retain the display name
    # requested by Ryan and link to the current profile.

  - name: Will Barker
    initials: WB
    role: Atmospheric Remote Sensing Scientist
    institution: NCAS, University of Leeds
    research: Specialises in scanning Doppler lidar, instrument control and atmospheric data analysis. His experience includes wind-energy measurements and lidar development for the FAAM Airborne Laboratory upgrade.
    profile_link: https://people.ncas.ac.uk/people/view/746
    # The profile's FAAM paragraph predates the facility's closure on 31 March 2026.
    # Describe that contribution as experience, not an ongoing upgrade.

  - name: Alex Fearn
    initials: AF
    role: Radar Support Engineer
    institution: NCAS, University of Leeds
    research: Operates and maintains research radars and supports field deployments. Contributed to the solar-powered insect radar installation at Rothamsted Research, enabling measurements away from mains power.
    research_source: https://ncas.ac.uk/scientists-get-set-to-spot-insects-with-new-sun-powered-radar/
    profile_link: https://people.ncas.ac.uk/people/view/627
    programme_path: /projects/aeroecology/
    programme_label: Radar aeroecology

research_students:
