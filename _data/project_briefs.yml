tone-ico-snotroll:
  facts:
    - label: Setting
      text: Troll Station and the Antarctic escarpment, Dronning Maud Land.
    - label: Observatory
      text: TONe–ICO · Cloudnet records from February 2025.
    - label: Research award
      text: SnøTroll · NERC award June 2026–June 2028; Ryan is Leeds PI.
    - label: Partnership
      text: UK, Norwegian and US researchers connect measurements with model evaluation.
  sections:
    - label: TONe–ICO
      anchor: toneico-year-round-observations-at-troll
    - label: SnøTroll
      anchor: snøtroll-from-terrain-to-snowfall
