      anchor: explore-the-observations

aeroecology:
  facts:
    - label: Setting
      text: UK airspace and coastal and offshore migration routes.
    - label: Approach
      text: Weather and entomological radar, ecological observations and scattering models.
    - label: Collaborations
      text: BioDAR, DRUID and AVOCET connect atmospheric physics with ecology.
    - label: Outputs
      text: Published abundance studies, reusable data and code, and UK BirdCast development.
  sections:
    - label: Questions
      anchor: questions-we-investigate
    - label: Findings
      anchor: what-the-observations-reveal
    - label: Collaborations
      anchor: from-biodiversity-monitoring-to-offshore-migration
    - label: UK BirdCast
      anchor: live-uk-bird-maps
